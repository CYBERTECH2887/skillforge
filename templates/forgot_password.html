{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto my-20 bg-white p-8 rounded-3xl shadow-xl border border-slate-100 text-center">
    <h2 class="text-2xl font-black mb-2 text-slate-900">Reset Password</h2>
    <p class="text-slate-500 mb-6 text-sm">Enter your registered email to receive a recovery link.</p>
    <input type="email" placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 mb-4 focus:border-orange-500 outline-none">
    <button onclick="alert('Recovery link sent to your email!')" class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold hover:bg-orange-500 transition">Send Reset Link</button>
    <a href="/login" class="block text-sm text-slate-500 mt-4 hover:underline">Back to Login</a>
</div>
{% endblock %}
