{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto my-16 bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
    <h2 class="text-3xl font-black mb-2 text-slate-900">Welcome Back</h2>
    <p class="text-slate-500 mb-8 text-sm">Enter your credentials to access your Skill Passport.</p>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-orange-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-orange-500 outline-none">
        </div>
        <div class="flex justify-between text-sm">
            <a href="/forgot-password" class="text-orange-500 font-semibold hover:underline">Forgot Password?</a>
        </div>
        <button type="submit" class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold hover:bg-orange-500 transition">Login</button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-6">Don't have an account? <a href="/register" class="text-orange-500 font-bold">Register</a></p>
</div>
{% endblock %}
