<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge 2.0 | Earn While You Learn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Toastify CSS for Modern Notifications -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white transition-all duration-300">

    <!-- Navbar with Blur & Shadow on Scroll -->
    <nav id="navbar" class="bg-white/80 backdrop-blur-lg border-b border-slate-200 sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <a href="/" class="font-black text-2xl tracking-tighter text-slate-900 flex items-center gap-2 hover:scale-105 transition-transform">
                <span class="bg-gradient-to-br from-orange-500 to-red-600 text-white p-1.5 rounded-lg shadow-lg shadow-orange-500/30">⚡</span> SkillForge
            </a>
            <div class="hidden md:flex items-center gap-6 font-medium text-sm">
                <a href="/dashboard" class="hover:text-orange-500 transition-colors">Dashboard</a>
                <a href="/tasks" class="hover:text-orange-500 transition-colors">Marketplace</a>
                <a href="/passport" class="hover:text-orange-500 transition-colors">Skill Passport</a>
                <a href="/hiring" class="hover:text-orange-500 transition-colors">Hiring Hub</a>
            </div>
            <div class="flex items-center gap-4">
                <a href="/login" class="text-slate-600 font-semibold hover:text-orange-500 text-sm transition-colors">Login</a>
                <a href="/register" class="bg-slate-900 text-white px-5 py-2.5 rounded-full font-bold text-sm hover:bg-orange-500 transition-all shadow-md">Get Started</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-sm border-t border-slate-800 mt-12">
        <p>&copy; 2026 SkillForge AI. Built for Next-Gen Learners.</p>
    </footer>

    <!-- Global JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Custom Global JS -->
    <script>
        // Modern Toast Notification Function
        function showToast(message, type = 'success') {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "bottom",
                position: "right",
                style: {
                    background: type === 'success' ? "linear-gradient(to right, #f97316, #ea580c)" : "#ef4444",
                    borderRadius: "10px",
                    boxShadow: "0 4px 6px -1px rgba(0, 0, 0, 0.1)"
                }
            }).showToast();
        }

        // Navbar Shadow on Scroll
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                document.getElementById('navbar').classList.add('shadow-md');
            } else {
                document.getElementById('navbar').classList.remove('shadow-md');
            }
        });
    </script>
</body>
</html>
