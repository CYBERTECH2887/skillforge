{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
    <h2 class="text-3xl font-black mb-2 text-slate-900">Create Account</h2>
    <p class="text-slate-500 mb-6 text-sm">Join the earn-while-you-learn ecosystem.</p>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Full Name</label>
            <input type="text" name="name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-orange-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-orange-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-orange-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-orange-500 text-white py-3.5 rounded-xl font-bold hover:bg-orange-600 transition">Register Now</button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-6">Already registered? <a href="/login" class="text-orange-500 font-bold">Login</a></p>
</div>
{% endblock %}
